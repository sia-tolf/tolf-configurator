<!DOCTYPE html>
<html lang="en" data-tolf-ui="configurator">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TOLF DNS Configurator</title>
<link rel="stylesheet" href="styles.css?v=dns-ui-20260926-1">
</head>
<body>
<main>
  <header class="page-header">
    <nav class="header-navigation" aria-label="Navigation">
      <a class="back" id="backLink" href="/?lang=en" aria-label="TOLF Configurator">
        <span class="back-chevron" aria-hidden="true">‹</span>
        <span class="tolf-wordmark">TOLF</span>
      </a>

      <div class="header-right">
        <div class="language" aria-label="Language">
          <button data-lang="en" type="button" lang="en" aria-label="English">EN</button>
          <button data-lang="ru" type="button" lang="ru" aria-label="Русский">RU</button>
          <button data-lang="lv" type="button" lang="lv" aria-label="Latviešu">LV</button>
        </div>
        <a id="helpLink" class="help-link" href="https://tolf.is/?lang=en#help" data-t="help">Help</a>
      </div>
    </nav>

    <div class="brand-copy">
      <h1 data-t="title">TOLF DNS</h1>
      <p class="subtitle" data-t="subtitle">Create a DNS configuration profile directly in your browser.</p>
    </div>
  </header>

  <section class="platform-card" aria-label="Device platform">
    <div class="platform-label" data-t="platform">Platform</div>
    <div class="platform-switcher" id="platformSwitcher">
      <button class="platform-button" type="button" data-platform="ios" aria-pressed="false">
        <span class="platform-icon" aria-hidden="true">●</span><span>iOS</span>
      </button>
      <button class="platform-button" type="button" data-platform="ipados" aria-pressed="false">
        <span class="platform-icon" aria-hidden="true">●</span><span>iPadOS</span>
      </button>
      <button class="platform-button" type="button" data-platform="android" aria-pressed="false">
        <span class="platform-icon android-icon" aria-hidden="true">●</span><span>Android</span>
      </button>
      <button class="platform-button" type="button" data-platform="windows" aria-pressed="false">
        <span class="platform-icon windows-icon" aria-hidden="true">◆</span><span>Windows</span>
      </button>
    </div>
  </section>

  <section class="card dns-card">
    <div class="mode-tabs" role="tablist" aria-label="DNS mode">
      <button class="mode active" type="button" data-mode="provider" data-t="providerMode">Provider</button>
      <button class="mode" type="button" data-mode="custom" data-t="customMode">Custom DNS</button>
    </div>

    <div id="providerPanel">
      <div class="field first-field">
        <label for="provider" data-t="provider">DNS provider</label>
        <select id="provider">
          <option value="quad9">Quad9</option>
          <option value="cloudflare">Cloudflare</option>
          <option value="yandex">Yandex DNS</option>
          <option value="dns4eu">DNS4EU</option>
        </select>
      </div>

      <div class="provider-info">
        <div>
          <span data-t="protocol">Protocol</span>
          <strong id="providerProtocol">DoH</strong>
        </div>
        <div>
          <span data-t="endpoint">Endpoint</span>
          <code id="providerEndpoint"></code>
        </div>
      </div>
    </div>

    <div id="customPanel" class="hidden">
      <div class="field first-field">
        <label for="customProtocol" data-t="protocol">Protocol</label>
        <select id="customProtocol">
          <option value="HTTPS">DNS over HTTPS (DoH)</option>
          <option value="TLS">DNS over TLS (DoT)</option>
          <option value="Cleartext" data-t="plainDns">DNS (unencrypted)</option>
        </select>
      </div>

      <div id="urlField" class="field">
        <label for="serverUrl" data-t="dohUrl">DoH URL</label>
        <input id="serverUrl" type="url" placeholder="https://example.com/dns-query" autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>

      <div id="hostField" class="field hidden">
        <label for="serverName" data-t="dotHost">DoT server name</label>
        <input id="serverName" type="text" placeholder="dns.example.com" autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>

      <div id="addressesField" class="field hidden">
        <label for="serverAddresses" data-t="addresses">DNS addresses</label>
        <textarea id="serverAddresses" rows="3" placeholder="9.9.9.9, 149.112.112.112"></textarea>
        <p class="hint" data-t="addressesHint">Enter IPv4 or IPv6 addresses separated by commas or new lines.</p>
      </div>
    </div>

    <input id="profileName" type="hidden" value="TOLF DNS Quad9">

    <div id="error" class="error hidden" role="alert"></div>

    <div class="actions">
      <button id="install" class="primary" type="button" data-t="install">Install Profile</button>
      <button id="share" class="secondary" type="button" data-t="share">Share Profile</button>
    </div>
  </section>

  <details class="privacy">
    <summary data-t="privateTitle">Processed locally</summary>
    <p data-t="privateText">DNS settings and generated profiles stay in this browser and are not sent to TOLF.</p>
  </details>
</main>
<script src="app.js?v=dns-ui-20260926-1"></script>
</body>
</html>
