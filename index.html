<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tolf Configurator</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0 48px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 36px;
      line-height: 1.1;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 0 42px;
      color: #5f5f63;
      font-size: 17px;
      line-height: 1.5;
    }

    .list {
      background: #ffffff;
      border: 1px solid #d8d8dc;
      border-radius: 14px;
      overflow: hidden;
    }

    .item {
      display: block;
      padding: 18px 20px;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid #e5e5e7;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-title {
      display: block;
      font-size: 18px;
      font-weight: 600;
    }

    .item-description {
      display: block;
      margin-top: 4px;
      color: #5f5f63;
      font-size: 17px;
      line-height: 1.45;
    }

    footer {
      margin-top: 34px;
      font-size: 14px;
      color: #77777c;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    @media (hover: hover) {
      .item:hover {
        background: #f7f7f8;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #000000;
        color: #f5f5f7;
      }

      .subtitle,
      .item-description {
        color: #b8b8bd;
      }

      footer {
        color: #9a9aa0;
      }

      .list {
        background: #1c1c1e;
        border-color: #38383a;
      }

      .item {
        border-color: #38383a;
      }

      .item:hover {
        background: #2c2c2e;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Tolf Configurator</h1>

    <p class="subtitle">
      Generate network configuration profiles directly in your browser.
    </p>

    <div class="list">
      <a class="item" href="#">
        <span class="item-title">IKEv2</span>
        <span class="item-description">
          Create an IKEv2 configuration profile for iPhone and iPad.
        </span>
      </a>

      <a class="item" href="#">
        <span class="item-title">DNS</span>
        <span class="item-description">
          Create a system DNS configuration profile.
        </span>
      </a>

      <a class="item" href="#">
        <span class="item-title">Wi-Fi</span>
        <span class="item-description">
          Create a Wi-Fi configuration profile.
        </span>
      </a>
    </div>

    <footer>
      <a href="#">Privacy &amp; Verification</a>
    </footer>
  </main>
</body>
</html>
