<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IKEv2 — Tolf Configurator</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #5f5f63;
      font-size: 16px;
      text-decoration: none;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 36px;
      line-height: 1.1;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 0 38px;
      color: #5f5f63;
      font-size: 17px;
      line-height: 1.5;
    }

    .section-title {
      margin: 30px 4px 10px;
      color: #5f5f63;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .group {
      background: #ffffff;
      border: 1px solid #d8d8dc;
      border-radius: 14px;
      overflow: hidden;
    }

    .field {
      display: flex;
      align-items: center;
      min-height: 58px;
      padding: 10px 16px;
      border-bottom: 1px solid #e5e5e7;
    }

    .field:last-child {
      border-bottom: 0;
    }

    .field label {
      width: 180px;
      flex: 0 0 180px;
      font-size: 17px;
      font-weight: 500;
    }

    .field input,
    .field select {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 17px;
      text-align: right;
    }

    .field input::placeholder {
      color: #a1a1a6;
    }

    details {
      margin-top: 30px;
    }

    summary {
      cursor: pointer;
      font-size: 17px;
      font-weight: 600;
      list-style-position: inside;
    }

    .advanced {
      margin-top: 12px;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 10px 16px;
      border-bottom: 1px solid #e5e5e7;
      font-size: 17px;
      font-weight: 500;
    }

    .switch-row:last-child {
      border-bottom: 0;
    }

    .switch-row input {
      width: 22px;
      height: 22px;
    }

    .action {
      margin-top: 34px;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: #1d1d1f;
      color: #ffffff;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .note {
      margin: 16px 4px 0;
      color: #77777c;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      main {
        padding-top: 28px;
      }

      h1 {
        font-size: 32px;
      }

      .field {
        display: block;
        padding: 13px 16px;
      }

      .field label {
        display: block;
        width: auto;
        margin-bottom: 6px;
      }

      .field input,
      .field select {
        text-align: left;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #000000;
        color: #f5f5f7;
      }

      .back,
      .subtitle,
      .section-title {
        color: #b8b8bd;
      }

      .group {
        background: #1c1c1e;
        border-color: #38383a;
      }

      .field,
      .switch-row {
        border-color: #38383a;
      }

      .field input::placeholder {
        color: #7c7c80;
      }

      button {
        background: #f5f5f7;
        color: #1d1d1f;
      }

      .note {
        color: #9a9aa0;
      }
    }
  </style>
</head>

<body>
  <main>

    <a class="back" href="../">‹ Tolf Configurator</a>

    <h1>IKEv2</h1>

    <p class="subtitle">
      Create an IKEv2 configuration profile for iPhone and iPad.
    </p>

    <div class="section-title">Connection</div>

    <div class="group">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="My VPN">
      </div>

      <div class="field">
        <label for="server">Server</label>
        <input id="server" type="text" placeholder="vpn.example.com">
      </div>

      <div class="field">
        <label for="remote-id">Remote ID</label>
        <input id="remote-id" type="text" placeholder="vpn.example.com">
      </div>

      <div class="field">
        <label for="local-id">Local ID</label>
        <input id="local-id" type="text" placeholder="Optional">
      </div>
    </div>

    <div class="section-title">Authentication</div>

    <div class="group">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="Username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password">
      </div>
    </div>

    <details>
      <summary>Advanced Settings</summary>

      <div class="group advanced">
        <div class="field">
          <label for="ike-encryption">IKE Encryption</label>
          <select id="ike-encryption">
            <option>AES-256</option>
            <option>AES-128</option>
          </select>
        </div>

        <div class="field">
          <label for="ike-integrity">IKE Integrity</label>
          <select id="ike-integrity">
            <option>SHA-256</option>
            <option>SHA-384</option>
            <option>SHA-512</option>
          </select>
        </div>

        <div class="field">
          <label for="dh-group">Diffie-Hellman</label>
          <select id="dh-group">
            <option>Group 14</option>
            <option>Group 19</option>
            <option>Group 20</option>
          </select>
        </div>

        <div class="switch-row">
          <span>Perfect Forward Secrecy</span>
          <input type="checkbox" checked>
        </div>

        <div class="switch-row">
          <span>MOBIKE</span>
          <input type="checkbox" checked>
        </div>

        <div class="switch-row">
          <span>On Demand</span>
          <input type="checkbox">
        </div>
      </div>
    </details>

    <div class="action">
      <button type="button">Generate Profile</button>
    </div>

    <p class="note">
      Profile data is processed locally in your browser.
      Nothing entered on this page is sent to the server.
    </p>

  </main>
</body>
</html>
